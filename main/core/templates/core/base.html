<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}STHIM{% endblock %}</title>
</head>
<body>

  {% block sidebar %}
  <aside>
    <h1><a href="{% url 'pages:home' %}">STHIM</a></h1>

    <nav>
      {% include "core/_menu_items.html" %}
    </nav>

    <div>
      <strong>{{ user.username }}</strong><br>
      <small>{{ user.get_sector_display }}</small>
    </div>
  </aside>
  {% endblock %}

  <main>
    {% if messages %}
      <ul>
        {% for message in messages %}<li>{{ message }}</li>{% endfor %}
      </ul>
    {% endif %}

    {% block content %}{% endblock %}
  </main>

</body>
</html>
