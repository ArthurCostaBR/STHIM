{% extends "core/base.html" %}

{% block title %}{{ heading }} · STHIM{% endblock %}

{% block content %}
  <section class="card card--narrow">
    <h2 class="card__title">{{ heading }}</h2>
    <p class="confirm__text">
      Tem certeza que deseja excluir <strong>{{ label }}</strong>? Esta ação não pode ser desfeita.
    </p>
    {% if note %}<p class="confirm__text">{{ note }}</p>{% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-actions">
        <button type="submit" class="btn btn--danger">Confirmar exclusão</button>
        <a class="btn btn--ghost" href="{{ cancel_url }}">Cancelar</a>
      </div>
    </form>
  </section>
{% endblock %}
